name: Build and Release

on:
  push:
    tags: ['*.*.*']          # v1.2.3, 0.0.1 …
  workflow_dispatch:

permissions:
  contents: write            # нужно для публикации релиза

jobs:
# ---------- BUILD ----------
  build:
    runs-on: ubuntu-latest
    # 👇  контексты secrets.* разрешены на уровне job‑env
    env:
      GITHUB_TOKEN:   ${{ secrets.GITHUB_TOKEN }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode keystore from base64   # выполняется, только если секрет задан
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/keystore.jks
          
      - name: Extract version from tag
        run: |
          echo "VERSION_NAME=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          echo "VERSION_CODE=$(git tag --sort=creatordate | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | wc -l)" >> $GITHUB_ENV


      - name: Build with Gradle
        run: ./gradlew assembleRelease

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk

# ---------- RELEASE ----------
  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: release-apk                   # ← та же папка

      # Берём первый найденный .apk и переименовываем
      - name: Rename APK for release
        run: |
          APK_FILE=$(find release-apk -maxdepth 1 -name '*.apk' -print -quit)
          mv "$APK_FILE" "TrainME_${{ github.ref_name }}.apk"

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name:    ${{ github.ref_name }}
          name:        ${{ github.ref_name }}
          draft:       false
          prerelease:  false
          files: |
            TrainME_${{ github.ref_name }}.apk
