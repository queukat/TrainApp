name: Build and Release

on:
  push:
    tags:
      - '*.*.*'          # v1.2.3, 0.0.1 …
  workflow_dispatch:

permissions:
  contents: write        # нужно для публикации релиза

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
# ---------- BUILD ----------
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode keystore from base64   # пропускаем шаг, если секрета нет
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/keystore.jks

      - name: Build with Gradle
        run: ./gradlew assembleRelease

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk

# ---------- RELEASE ----------
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: .                 # скачает в ./release-apk/...

      - name: Rename APK for release
        run: |
          mv release-apk/app-release.apk "TrainME_${{ github.ref_name }}.apk"

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name:     ${{ github.ref_name }}
          draft:    false
          prerelease: false
          files: |
            TrainME_${{ github.ref_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
