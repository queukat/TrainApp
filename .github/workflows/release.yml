name: Build and Release

on:
  push:
    tags: ['*.*.*']          # v1.2.3, 0.0.1 …
  workflow_dispatch:

permissions:
  contents: write            # нужно для публикации релиза

jobs:
# ---------- BUILD ----------
  build:
    runs-on: ubuntu-latest
    # 👇  контексты secrets.* разрешены на уровне job‑env
    env:
      GITHUB_TOKEN:   ${{ secrets.GITHUB_TOKEN }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      TRAINAPP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      TRAINAPP_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      TRAINAPP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode keystore from base64   # выполняется, только если секрет задан
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/keystore.jks
          echo "TRAINAPP_KEYSTORE_FILE=$GITHUB_WORKSPACE/app/keystore.jks" >> $GITHUB_ENV
          
      - name: Extract version from tag
        run: |
          echo "VERSION_NAME=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          echo "VERSION_CODE=$(git rev-list --count HEAD)" >> $GITHUB_ENV


      - name: Build with Gradle
        run: ./gradlew bundleRelease

      - name: Sign AAB with jarsigner
        run: |
          jarsigner \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore "$TRAINAPP_KEYSTORE_FILE" \
            -storepass "$TRAINAPP_KEYSTORE_PASSWORD" \
            -keypass "$TRAINAPP_KEY_PASSWORD" \
            app/build/outputs/bundle/release/app-release.aab \
            "$TRAINAPP_KEY_ALIAS"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/app-release.aab

# ---------- RELEASE ----------
  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: release-aab
          path: release-aab

      - name: Rename AAB for release
        run: |
          AAB_FILE=$(find release-aab -maxdepth 1 -name '*.aab' -print -quit)
          mv "$AAB_FILE" "TrainME_${{ github.ref_name }}.aab"

      - name: Create GitHub Release and upload AAB
        uses: softprops/action-gh-release@v1
        with:
          tag_name:    ${{ github.ref_name }}
          name:        ${{ github.ref_name }}
          draft:       false
          prerelease:  false
          files: |
            TrainME_${{ github.ref_name }}.aab
