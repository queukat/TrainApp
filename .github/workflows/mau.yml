name: Update MAU & TOTAL badges
permissions: { contents: write }

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  calc-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - run: mkdir -p badges

      - name: Fetch stats
        id: stats
        shell: bash
        run: |
          set -euo pipefail

          mau="$(curl -fsS --retry 3 --retry-all-errors --max-time 15 https://train-stats.queukat.workers.dev/mau)"
          total="$(curl -fsS --retry 3 --retry-all-errors --max-time 15 https://train-stats.queukat.workers.dev/total)"

          [[ "$mau" =~ ^[0-9]+$ ]] || { echo "Invalid MAU: $mau" >&2; exit 1; }
          [[ "$total" =~ ^[0-9]+$ ]] || { echo "Invalid TOTAL: $total" >&2; exit 1; }

          echo "mau=$mau" >> "$GITHUB_OUTPUT"
          echo "total=$total" >> "$GITHUB_OUTPUT"

      - name: Generate badge SVGs
        env:
          MAU_VALUE: ${{ steps.stats.outputs.mau }}
          TOTAL_VALUE: ${{ steps.stats.outputs.total }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import html
          import os

          badges_dir = Path("badges")
          badges_dir.mkdir(parents=True, exist_ok=True)

          def badge_svg(label: str, value: str, color: str) -> str:
              label = html.escape(label)
              value = html.escape(value)
              label_width = max(46, 7 * len(label) + 22)
              value_width = max(28, 7 * len(value) + 16)
              total_width = label_width + value_width
              label_x = label_width / 2
              value_x = label_width + value_width / 2
              return f"""<svg xmlns="http://www.w3.org/2000/svg" width="{total_width}" height="20" role="img" aria-label="{label}: {value}">
          <title>{label}: {value}</title>
          <linearGradient id="s" x2="0" y2="100%">
            <stop offset="0" stop-color="#fff" stop-opacity=".7"/>
            <stop offset=".1" stop-color="#aaa" stop-opacity=".1"/>
            <stop offset=".9" stop-color="#000" stop-opacity=".3"/>
            <stop offset="1" stop-color="#000" stop-opacity=".5"/>
          </linearGradient>
          <clipPath id="r">
            <rect width="{total_width}" height="20" rx="3" fill="#fff"/>
          </clipPath>
          <g clip-path="url(#r)">
            <rect width="{label_width}" height="20" fill="#555"/>
            <rect x="{label_width}" width="{value_width}" height="20" fill="{color}"/>
            <rect width="{total_width}" height="20" fill="url(#s)"/>
          </g>
          <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">
            <text x="{label_x}" y="15" fill="#010101" fill-opacity=".3">{label}</text>
            <text x="{label_x}" y="14">{label}</text>
            <text x="{value_x}" y="15" fill="#010101" fill-opacity=".3">{value}</text>
            <text x="{value_x}" y="14">{value}</text>
          </g>
          </svg>
          """

          (badges_dir / "mau.svg").write_text(
              badge_svg("active users", os.environ["MAU_VALUE"], "#007ec6"),
              encoding="utf-8",
          )
          (badges_dir / "total.svg").write_text(
              badge_svg("total users", os.environ["TOTAL_VALUE"], "#4aa3ff"),
              encoding="utf-8",
          )
          PY

      - name: Commit updated badges
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges/*.svg
          if git diff --cached --quiet; then
            echo "No badge changes to commit"
            exit 0
          fi
          git commit -m "chore: update MAU & TOTAL badges"
          git push origin "HEAD:${GITHUB_REF_NAME}"
