name: Update MAU & TOTAL badges
permissions: { contents: write }

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  calc-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p badges

      - name: Fetch stats
        id: stats
        shell: bash
        run: |
          set -euo pipefail

          mau="$(curl -fsS --retry 3 --retry-all-errors --max-time 15 https://train-stats.queukat.workers.dev/mau)"
          total="$(curl -fsS --retry 3 --retry-all-errors --max-time 15 https://train-stats.queukat.workers.dev/total)"

          [[ "$mau" =~ ^[0-9]+$ ]] || { echo "Invalid MAU: $mau" >&2; exit 1; }
          [[ "$total" =~ ^[0-9]+$ ]] || { echo "Invalid TOTAL: $total" >&2; exit 1; }

          echo "mau=$mau" >> "$GITHUB_OUTPUT"
          echo "total=$total" >> "$GITHUB_OUTPUT"

      - uses: emibcn/badge-action@v2
        with:
          label: active users
          status: ${{ steps.stats.outputs.mau }}
          color: blue
          path: badges/mau.svg

      - uses: emibcn/badge-action@v2
        with:
          label: total users
          status: ${{ steps.stats.outputs.total }}
          color: 9cf
          path: badges/total.svg

      - uses: EndBug/add-and-commit@v9
        with:
          add: 'badges/*.svg'
          message: 'chore: update MAU & TOTAL badges'
